### model
model_name_or_path: Qwen/Qwen3-8B
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8  # unstated in paper; repo default
lora_target: all  # unstated in paper; repo default

### dataset
dataset: tabrank_cot_gen
template: qwen3
enable_thinking: true  # response-side think block is loss-bearing (explicit for contrast with the cot_cond config)
cutoff_len: 25000  # paper's 25k-token filtering cap
# max_samples intentionally unset: the paper trains on all 6,728 queries; the demo configs' cap of 1000 would use ~15% of the data (~47 optimizer steps at effective batch 64 x 3 epochs). Set max_samples: 1000 only for a smoke test.
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/qwen3-8b/lora/sft_cot_gen
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none  # choices: [none, wandb, tensorboard, swanlab, mlflow]

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 32  # 1 x 32 x 2 GPUs = effective batch 64 (paper: 2xH200)
learning_rate: 5.0e-5
num_train_epochs: 3.0  # unstated in paper; repo default
lr_scheduler_type: cosine  # unstated in paper; repo default
warmup_ratio: 0.1  # unstated in paper; repo default
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

